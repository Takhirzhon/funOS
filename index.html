<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The flag, in the two forms the tab strip and the home screen want. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#245edb" />
    <!-- No pinch zoom, no zoom-out to fit: this is a desktop, not a page. Without
         minimum-scale a window wider than the screen makes the phone zoom out to
         show it, and every number the shell measures is wrong from then on. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <title>funOS - Tokhirzhon Tashmatov</title>
    <meta name="description" content="Tokhirzhon Tashmatov's portfolio: a Windows XP desktop that runs in your browser. The CV is on the desktop." />
    <link rel="canonical" href="https://khirokhito.tech/" />
    <!-- What a link to this page looks like in a chat or a feed. The image is
         a screenshot of the desktop at 1200x630, regenerated by hand when the
         desktop changes enough to matter (see TODO.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="funOS" />
    <meta property="og:title" content="Tokhirzhon Tashmatov - a Windows XP desktop in your browser" />
    <meta property="og:description" content="AI/ML engineer, Bishkek. The CV is on the desktop, the photographs are in My Pictures, and Internet Explorer opens on the home page." />
    <meta property="og:url" content="https://khirokhito.tech/" />
    <meta property="og:image" content="https://khirokhito.tech/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tokhirzhon Tashmatov - a Windows XP desktop in your browser" />

    <meta name="twitter:image" content="https://khirokhito.tech/og.jpg" />
  </head>
