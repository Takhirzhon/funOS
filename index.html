<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The flag, in the two forms the tab strip and the home screen want. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#245edb" />
    <!-- No pinch zoom, no zoom-out to fit: this is a desktop, not a page. Without
         minimum-scale a window wider than the screen makes the phone zoom out to
         show it, and every number the shell measures is wrong from then on. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <title>funOS - Tokhirzhon Tashmatov</title>
    <meta name="description" content="Tokhirzhon Tashmatov's portfolio: a Windows XP desktop that runs in your browser. The CV is on the desktop." />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
