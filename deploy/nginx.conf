server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    # Both JavaScript types. nginx's mime.types has moved .js between them across
    # releases, and a mismatch here is silent: the bundle ships uncompressed and
    # CI's gzipped size budget measures a number the browser never sees. The
    # image smoke test in ci.yml asserts content-encoding on the entry chunk.
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # __GIT_SHA__ is replaced at image build time from the GIT_SHA build arg.
    location = /health {
        include /etc/nginx/conf.d/security-headers.inc;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","version":"__GIT_SHA__"}';
    }

    # Vite emits content-hashed filenames into /assets, so they are immutable.
    #
    # One Cache-Control header, not two. `expires 1y` emits its own
    # `Cache-Control: max-age=31536000`, so pairing it with an `add_header` sent
    # the real response twice over:
    #
    #     cache-control: max-age=31536000
    #     cache-control: public, immutable
    #
    # Which is legal — a recipient joins repeated headers with commas — and was
    # verified working in production on 2026-09-14. It is still worth collapsing:
    # it reads like a bug to whoever sees it next, and the field-combining rule
    # is exactly the kind of thing a naive intermediary gets wrong by taking the
    # first value and dropping `immutable`. `expires` also sets an `Expires:`
    # header for HTTP/1.0 caches, which nothing has needed for twenty years.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # The portfolio keeps its file names across deploys - CV.pdf is always
    # CV.pdf - so it cannot be immutable the way /assets/ is. `no-cache` is
    # "revalidate every time", not "never store": nginx answers a conditional
    # request with 304 off the file's mtime and ETag, so a returning visitor
    # pays one round trip per file and downloads only what actually changed.
    location /portfolio/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The web app manifest. `default_type` only applies when mime.types has
    # no entry for .webmanifest, which depends on the nginx release - a
    # `types {}` block here would replace the whole inherited map instead.
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-headers.inc;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # The shell must never be cached, or a deploy ships new assets that the
    # stale index.html does not reference.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: unknown paths are client-side routes, not 404s.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
