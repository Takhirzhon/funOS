server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    # Both JavaScript types. nginx's mime.types has moved .js between them across
    # releases, and a mismatch here is silent: the bundle ships uncompressed and
    # CI's gzipped size budget measures a number the browser never sees. The
    # image smoke test in ci.yml asserts content-encoding on the entry chunk.
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # __GIT_SHA__ is replaced at image build time from the GIT_SHA build arg.
    location = /health {
        include /etc/nginx/conf.d/security-headers.inc;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","version":"__GIT_SHA__"}';
    }

    # Vite emits content-hashed filenames into /assets, so they are immutable.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell must never be cached, or a deploy ships new assets that the
    # stale index.html does not reference.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: unknown paths are client-side routes, not 404s.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
